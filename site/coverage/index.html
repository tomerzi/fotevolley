<meta charset="utf-8">
<title>מפת הכיסוי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the whole page is the venue. Raked sand everywhere; an LED scoreboard on top; the three views are sponsor
   boards you tap; the court is a real sand court whose players, zones and net can be clicked; below it sit four
   football-style heat maps on small courts and a printed stat sheet. Single daylight look. */
:root{
  --sand:#d8bb87; --sand-hi:#efdcb6; --sand-lo:#b99a66; --ink:#2a1c0c; --ink-2:#5b4630; --ink-3:#8a7556;
  --tape:#1d4fa8; --isr:#1f63c9; --bra:#0d7f3f; --hit:#c8322c;
  --led:#ffb02e; --paper:#fbf8f1; --paper-line:#e5dccb; --clip:#9aa3b0;
  --disp:"Karantina","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
html{background:var(--sand)}
body{color:var(--ink);font:15px/1.45 var(--body);background-color:var(--sand);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.score{background:linear-gradient(180deg,#1a1f27,#07090c);border-radius:10px;padding:12px 18px;box-shadow:0 10px 0 -4px #00000030,0 18px 30px -12px #00000080,inset 0 0 0 2px #2b313b,inset 0 0 0 5px #0a0c10;
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;position:relative}
.score::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:radial-gradient(#ffffff0a 1px,transparent 1.4px) 0 0/5px 5px}
.led{font:700 54px/.9 var(--disp);color:var(--led);text-shadow:0 0 6px #ff9d0080,0 0 18px #ff8a0040;font-variant-numeric:tabular-nums}
.score .mid{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.score .ttl{font:700 30px/.9 var(--disp);color:#fff;letter-spacing:.04em}
.score .sub{font:600 11px var(--mono);color:#8b96a8;letter-spacing:.14em}
.score .team{display:flex;align-items:center;gap:10px}
.score .tn{font:700 26px/1 var(--disp);color:#cfd6e2;letter-spacing:.08em}
@media (max-width:640px){.led{font-size:38px}.score .ttl{font-size:22px}.score{grid-template-columns:1fr;justify-items:center}}
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sb{position:relative;border:0;cursor:pointer;border-radius:3px;padding:12px 14px 10px;text-align:start;font:700 30px/.9 var(--disp);color:#fff;letter-spacing:.03em;box-shadow:0 6px 0 -2px #00000035,0 12px 18px -10px #0000007a;transition:transform .12s}
.sb small{display:block;font:600 12px var(--body);letter-spacing:0;opacity:.9;margin-top:4px}
.sb:nth-child(1){background:linear-gradient(180deg,#2560c4,#1d4fa8)}
.sb:nth-child(2){background:linear-gradient(180deg,#f3c43f,#e0a91d);color:#2a1c0c}
.sb:nth-child(3){background:linear-gradient(180deg,#1b8a4e,#0d7f3f)}
.sb::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff38,transparent 40%);border-radius:3px;pointer-events:none}
.sb[aria-pressed="true"]{transform:translateY(-4px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 14px 20px -10px #000a}
.sb:focus-visible,.chip:focus-visible,.step:focus-visible,.hot:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:560px){.sb{font-size:22px;padding:10px}.sb small{display:none}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1060px){.main{grid-template-columns:1fr}}
.courtbox{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 20px 40px -24px #5a3d16}
.sc{overflow-x:auto}
.layers{position:relative;aspect-ratio:1000/600;min-width:720px}
.layers canvas,.layers svg{position:absolute;inset:0;width:100%;height:100%}
svg{direction:ltr;overflow:visible}svg text{font-family:var(--body)}
.hot{cursor:pointer}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:600 13.5px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--sand-lo);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;box-shadow:0 2px 0 #00000018}
.chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 9.5px var(--mono);font-style:normal;color:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="false"].pl{opacity:.5}
.step{font:600 16px var(--mono);background:var(--paper);border:1.5px solid var(--sand-lo);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--ink)}
.cnt{font:600 13px var(--mono);direction:ltr}
.hint{font-size:13px;color:var(--ink-2)}
.clipb{background:#c9a16b;border-radius:10px;padding:26px 10px 10px;position:relative;box-shadow:0 18px 30px -18px #5a3d16,inset 0 0 0 1px #00000020}
.clipb::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:110px;height:26px;border-radius:6px;background:linear-gradient(180deg,#d9dee6,var(--clip));box-shadow:0 3px 4px #0000004d}
.paper{background:var(--paper);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:280px;background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--paper-line) 27px 28px)}
.paper h2{margin:0;font:700 30px/.95 var(--disp)}
.paper .tag{font:600 11px var(--mono);letter-spacing:.12em;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.kv b{font:600 13.5px var(--mono);text-align:end;unicode-bidi:plaintext}
.bigs{display:flex;gap:16px;flex-wrap:wrap}
.bigs div{display:flex;flex-direction:column}
.bigs b{font:700 40px/.9 var(--disp);font-variant-numeric:tabular-nums}
.bigs span{font-size:12px;color:var(--ink-2)}
section.hm{display:flex;flex-direction:column;gap:10px}
.sectitle{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sectitle h2{margin:0;font:700 40px/.9 var(--disp)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid4{grid-template-columns:1fr}}
.pcard{background:var(--paper);border-radius:6px;padding:10px;box-shadow:0 10px 20px -14px #5a3d16;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.pcard h3{margin:0;font:700 24px/.9 var(--disp)}
.pcard canvas{width:100%;height:auto;border-radius:3px;display:block}
.pcard .mm{font:600 11.5px var(--mono);color:var(--ink-2);direction:ltr}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.ramp i{display:block;width:180px;height:10px;border-radius:5px;background:linear-gradient(270deg,#2b7bff,#22c3e6,#3fd36b,#f7e23b,#ff9a1f,#e52b1c)}
.sheet{background:var(--paper);border-radius:6px;padding:16px;box-shadow:0 10px 20px -14px #5a3d16;overflow-x:auto}
table.st{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
table.st th{font:600 11px var(--mono);letter-spacing:.04em;color:var(--ink-3);text-align:start;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.st td{padding:7px 8px;border-bottom:1px solid var(--paper-line)}
table.st td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.st tr.team td{font-weight:800;background:#f3ecdd;font-family:var(--body)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 9px;font-size:13px;z-index:20;max-width:280px;opacity:0;transition:opacity .1s}
@keyframes sweep{to{stroke-dashoffset:-40}}@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.35}}
.ring{animation:sweep 1.6s linear infinite}.spark{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ring,.spark{animation:none}*{transition:none!important}}
</style>

<div class="wrap" dir="rtl">
  <div class="score" role="banner">
    <div class="team"><span class="tn">ISR</span><span class="led" id="sI">0</span></div>
    <div class="mid"><div class="ttl">כיסוי שטח</div><div class="sub">GRAZ 2022 · 60 POINTS · ISRAEL ALWAYS LEFT</div></div>
    <div class="team"><span class="led" id="sB">2</span><span class="tn">BRA</span></div>
  </div>
  <div class="boards" role="group" aria-label="תצוגה">
    <button class="sb" data-m="heat">מיקומים<small>איפה כל שחקן עמד</small></button>
    <button class="sb" data-m="holes">שטח פתוח<small>מה נשאר בלי שמירה</small></button>
    <button class="sb" data-m="attack">רדאר<small>התקפה אחר התקפה</small></button>
  </div>
  <div class="main">
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="ctl" id="ctl"></div>
      <div class="courtbox"><div class="sc"><div class="layers">
        <canvas id="cv" width="2000" height="1200" aria-hidden="true"></canvas>
        <svg id="sv" viewBox="0 0 1000 600" role="img" aria-label="מגרש פוצ'יוולי; אפשר ללחוץ על שחקנים, אזורים והרשת"></svg>
      </div></div></div>
      <div class="hint" id="hint"></div>
    </div>
    <aside class="clipb" aria-live="polite"><div class="paper" id="info"></div></aside>
  </div>
  <section class="hm">
    <div class="sectitle"><h2>מפת חום</h2><div class="ctl" id="hmctl"></div></div>
    <div class="ramp"><span>הכי הרבה זמן</span><i></i><span>מעט זמן</span></div>
    <div class="grid4" id="hm"></div>
  </section>
  <section class="hm">
    <div class="sectitle"><h2>הנתונים היבשים</h2><span class="hint">זמן משחק בלבד · מטרים, אחוזים, קמ״ש</span></div>
    <div class="sheet" id="sheet"></div>
  </section>
</div>
<div id="tip" role="tooltip"></div>

<script>
const NS='http://www.w3.org/2000/svg';
const PL=['Ron_Ben_Ishay','Maor_Haas','Franklin','Hiltinho'];
const NM={Ron_Ben_Ishay:'רון בן ישי',Maor_Haas:'מאור האס',Franklin:'פרנקלין',Hiltinho:'הילטיניו'};
const IN={Ron_Ben_Ishay:'MH',Maor_Haas:'RB',Franklin:'F',Hiltinho:'H'};
const TM={Ron_Ben_Ishay:'ISR',Maor_Haas:'ISR',Franklin:'BRA',Hiltinho:'BRA'};
const PAIR={ISR:['Ron_Ben_Ishay','Maor_Haas'],BRA:['Franklin','Hiltinho']};
const TS={ISR:'#1f63c9',BRA:'#0d7f3f'},TN={ISR:'ישראל',BRA:'ברזיל'};
const SAND={hit:'#c8322c',ink:'#2a1c0c'};
const PH=[['all','כל המשחק'],['own ball','כדור אצלנו'],['opponent ball','כדור אצל היריב'],['won','נקודות שזכו'],['lost','נקודות שהפסידו']];
const OUTN={kill:'נקודה',failed_defence:'נקודה',returned:'הוחזרה',error:'טעות'};
const ACT={reception:'קבלה',set:'הנחה',attack:'התקפה'};
const $=s=>document.querySelector(s);
function el(t,a={},p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a={}){const t=el('text',Object.assign({x,y},a),p);t.textContent=s;return t}
const tip=$('#tip');function hover(n,h){n.addEventListener('pointermove',e=>{tip.innerHTML=h;tip.style.opacity=1;const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX+14))+'px';tip.style.top=(e.clientY+16)+'px'});n.addEventListener('pointerleave',()=>tip.style.opacity=0)}
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const pct=v=>Math.round(v*100)+'%';
const S={mode:'heat',players:new Set(PL),phase:'all',team:'ISR',ai:0,aflt:'all',sel:null,hmPhase:'all'};
let D,Mx;
Promise.all([fetch('coverage.json').then(r=>r.json()),fetch('match.json').then(r=>r.json())]).then(([d,m])=>{D=d;Mx=m;init();render()}).catch(e=>{$('#info').textContent='הנתונים לא נטענו: '+e.message});

const SC=52,OX=84,OY=92,X=x=>OX+x*SC,Y=y=>OY+y*SC,K=2;
const cv=$('#cv'),cx=cv.getContext('2d'),sv=$('#sv');

function paintSand(g,W,H,Xf,Yf,opts={}){let seed=opts.seed||11;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const u=W/1000;
  g.fillStyle='#d8bb87';g.fillRect(0,0,W,H);
  if(!opts.flat)for(let i=0;i<Math.max(12,Math.round(60*W/2000));i++){const x=R()*W,y=R()*H,r=(80+R()*380)*u/2;const lt=R()<.5;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,lt?'rgba(246,226,186,.35)':'rgba(170,135,85,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  if(opts.rake){g.save();g.beginPath();g.rect(0,0,W,H);if(Xf)g.rect(Xf(-0.6),Yf(-0.6),Xf(16.6)-Xf(-0.6),Yf(8.6)-Yf(-0.6));g.clip('evenodd');
    for(let y=0;y<H;y+=7*u){g.strokeStyle=`rgba(${R()<.5?'255,240,210':'140,110,70'},.18)`;g.lineWidth=1.4*u;g.beginPath();g.moveTo(0,y);for(let x=0;x<=W;x+=40*u)g.lineTo(x,y+Math.sin(x/(160*u)+y)*3*u);g.stroke()}g.restore()}
  if(opts.foot){const cells=[];let tot=0;PL.forEach(p=>D.heat[p].all.forEach((row,j)=>row.forEach((v,i)=>{if(v>0){cells.push([i,j,v]);tot+=v}})));
    const fl=document.createElement('canvas');fl.width=W;fl.height=H;const f=fl.getContext('2d');
    for(let n=0;n<opts.foot;n++){let t=R()*tot,k=0;while(k<cells.length-1&&(t-=cells[k][2])>0)k++;const [i,j]=cells[k];
      const x=Xf(D.x0+(i+R())*D.cell),y=Yf(D.y0+(j+R())*D.cell),a=R()*Math.PI,len=(6+R()*3)*u,wd=(2.6+R())*u;
      f.save();f.translate(x,y);f.rotate(a);f.fillStyle='rgba(120,88,48,.13)';f.beginPath();f.ellipse(0,0,len,wd,0,0,7);f.fill();f.fillStyle='rgba(255,244,220,.14)';f.beginPath();f.ellipse(-1.2*u,-1.2*u,len*.9,wd*.7,0,0,7);f.fill();f.restore()}
    g.filter=`blur(${1.5*u/2}px)`;g.drawImage(fl,0,0);g.filter='none'}
  const im=g.getImageData(0,0,W,H),d=im.data;for(let q=0;q<d.length;q+=4){const n=(R()-.5)*26;d[q]+=n;d[q+1]+=n*.92;d[q+2]+=n*.8}g.putImageData(im,0,0)}
function paintLines(g,Xf,Yf,u,full){let seed=5;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const tape=(x1,y1,x2,y2)=>{[[1.6,'rgba(70,50,20,.35)',4.6],[0,'#1d4fa8',4.2],[-.8,'rgba(170,200,255,.55)',1.2]].forEach(([o,col,w])=>{g.strokeStyle=col;g.lineWidth=w*u;g.lineCap='round';g.beginPath();for(let s=0;s<=24;s++){const t=s/24,wob=(R()-.5)*.6*u;const px=Xf(x1+(x2-x1)*t)+o*u+(y1==y2?0:wob),py=Yf(y1+(y2-y1)*t)+o*u+(y1==y2?wob:0);s?g.lineTo(px,py):g.moveTo(px,py)}g.stroke()})};
  tape(0,0,16,0);tape(0,8,16,8);tape(0,0,0,8);tape(16,0,16,8);
  const sh=h=>[-0.43*h/Math.tan(47*Math.PI/180),-0.90*h/Math.tan(47*Math.PI/180)];
  if(full){const [nx,ny]=sh(2.2),[bx,by]=sh(1.2);const nl=document.createElement('canvas');nl.width=g.canvas.width;nl.height=g.canvas.height;const n=nl.getContext('2d');n.strokeStyle='rgba(60,40,15,.14)';n.lineWidth=u;
    for(let y=-0.9;y<=8.9;y+=0.1){n.beginPath();n.moveTo(Xf(8+bx),Yf(y+by));n.lineTo(Xf(8+nx),Yf(y+ny));n.stroke()}n.lineWidth=2.4*u;n.strokeStyle='rgba(60,40,15,.22)';[[nx,ny],[bx,by]].forEach(([dx,dy])=>{n.beginPath();n.moveTo(Xf(8+dx),Yf(-0.9+dy));n.lineTo(Xf(8+dx),Yf(8.9+dy));n.stroke()});
    g.filter='blur(1.2px)';g.drawImage(nl,0,0);g.filter='none';
    [-0.9,8.9].forEach(py=>{const [dx,dy]=sh(2.5);g.strokeStyle='rgba(60,40,15,.38)';g.lineWidth=9*u;g.lineCap='round';g.beginPath();g.moveTo(Xf(8),Yf(py));g.lineTo(Xf(8+dx),Yf(py+dy));g.stroke()})}
  g.strokeStyle='rgba(30,30,30,.55)';g.lineWidth=5*u;g.beginPath();g.moveTo(Xf(8),Yf(-0.9));g.lineTo(Xf(8),Yf(8.9));g.stroke();
  g.strokeStyle='#fbfbf6';g.lineWidth=2.6*u;g.beginPath();g.moveTo(Xf(8),Yf(-0.9));g.lineTo(Xf(8),Yf(8.9));g.stroke();
  [0,8].forEach(py=>{for(let k=0;k<6;k++){g.fillStyle=k%2?'#fff':'#d22';g.beginPath();g.arc(Xf(8),Yf(py)+(k-2.5)*2.4*u,2.4*u,0,7);g.fill()}});
  [-0.9,8.9].forEach(py=>{const x=Xf(8),y=Yf(py);const gr=g.createRadialGradient(x-3*u,y-3*u,1,x,y,11*u);gr.addColorStop(0,'#fff');gr.addColorStop(.7,'#c9d3e6');gr.addColorStop(1,'#5f6f8e');g.fillStyle=gr;g.beginPath();g.arc(x,y,10*u,0,7);g.fill();g.strokeStyle='#1d4fa8';g.lineWidth=2*u;g.stroke()});
  if(full){const [dx,dy]=sh(2),x=Xf(8),y=Yf(9.7);g.fillStyle='rgba(60,40,15,.3)';g.fillRect(x-14*u+dx*SC*u,y-12*u+dy*SC*u,28*u,24*u);g.fillStyle='#e9e4da';g.fillRect(x-14*u,y-12*u,28*u,24*u);g.strokeStyle='#8b8578';g.lineWidth=1.5*u;g.strokeRect(x-14*u,y-12*u,28*u,24*u);g.fillStyle='#4a4a4a';g.fillRect(x-7*u,y-6*u,14*u,12*u);
    for(let i=0;i<7;i++){const bx=Xf(-0.6+i*2.5),by=Yf(-1.5);g.fillStyle='rgba(60,40,15,.28)';g.fillRect(bx+3*u,by+8*u,118*u,10*u);g.fillStyle=i%2?'#1d4fa8':'#f0c23a';g.fillRect(bx,by,118*u,11*u);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(bx,by,118*u,2*u)}}}
let COURT=null;
function buildCourt(){const c=document.createElement('canvas');c.width=1000*K;c.height=600*K;const g=c.getContext('2d');const Xf=x=>X(x)*K,Yf=y=>Y(y)*K;paintSand(g,c.width,c.height,Xf,Yf,{rake:true,foot:1100});paintLines(g,Xf,Yf,K,true);COURT=c}
function sandBackground(){const c=document.createElement('canvas');c.width=700;c.height=700;const g=c.getContext('2d');paintSand(g,700,700,null,null,{seed:3,rake:true,flat:true});document.body.style.backgroundImage=`url(${c.toDataURL('image/jpeg',.82)})`}
function stage(){if(!COURT)buildCourt();cx.setTransform(1,0,0,1,0,0);cx.globalCompositeOperation='source-over';cx.filter='none';cx.globalAlpha=1;cx.drawImage(COURT,0,0);cx.setTransform(K,0,0,K,0,0);sv.innerHTML=''}
function labels(){txt(sv,X(0),Y(-0.62),'ISR',{'font-size':26,'font-family':'Karantina','font-weight':700,fill:TS.ISR,'letter-spacing':2,stroke:'#f6ead0','stroke-width':3,'paint-order':'stroke'});
  txt(sv,X(16),Y(-0.62),'BRA',{'font-size':26,'font-family':'Karantina','font-weight':700,fill:TS.BRA,'text-anchor':'end','letter-spacing':2,stroke:'#f6ead0','stroke-width':3,'paint-order':'stroke'});
  for(let m=0;m<=16;m+=2){el('line',{x1:X(m),x2:X(m),y1:Y(8)+8,y2:Y(8)+14,stroke:SAND.ink,opacity:.6},sv);txt(sv,X(m),Y(8)+28,m,{'font-size':10,fill:SAND.ink,opacity:.75,'text-anchor':'middle','font-family':'JetBrains Mono'})}}

/* football heat maps: red = most time, then orange, yellow, green, cyan, blue */
const JET=[[0,[43,123,255]],[.2,[34,195,230]],[.4,[63,211,107]],[.6,[247,226,59]],[.8,[255,154,31]],[1,[229,43,28]]];
function jet(t){for(let i=1;i<JET.length;i++)if(t<=JET[i][0]){const [a,ca]=JET[i-1],[b,cb]=JET[i],f=(t-a)/(b-a);return ca.map((c,k)=>Math.round(c+(cb[k]-c)*f))}return JET.at(-1)[1]}
let MINI=null;
function miniBase(w,h){if(MINI)return MINI;const s=w/18.4,ox=1.2*s,oy=1*s;const Xf=x=>ox+x*s,Yf=y=>oy+y*s;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');paintSand(g,w,h,Xf,Yf,{seed:21});paintLines(g,Xf,Yf,w/1000*1.4,false);MINI={c,Xf,Yf,s};return MINI}
function drawMini(canvas,p,ph){const w=canvas.width,h=canvas.height,b=miniBase(w,h),g=canvas.getContext('2d');g.drawImage(b.c,0,0);
  const G=D.heat[p][ph],mx=Math.max(...G.flat());const am=document.createElement('canvas');am.width=w;am.height=h;const a=am.getContext('2d');
  G.forEach((row,j)=>row.forEach((v,i)=>{if(v<=0)return;a.fillStyle=`rgba(0,0,0,${Math.min(1,v/mx)})`;a.fillRect(b.Xf(D.x0+i*D.cell),b.Yf(D.y0+j*D.cell),D.cell*b.s+1,D.cell*b.s+1)}));
  const bl=document.createElement('canvas');bl.width=w;bl.height=h;const bb=bl.getContext('2d');bb.filter=`blur(${b.s*.6}px)`;bb.drawImage(am,0,0);
  const src=bb.getImageData(0,0,w,h).data;let top=0;for(let q=3;q<src.length;q+=4)if(src[q]>top)top=src[q];
  const out=g.createImageData(w,h);for(let q=0;q<src.length;q+=4){const t=src[q+3]/(top||1);if(t<0.07)continue;const [r,gg,bl_]=jet(t);out.data[q]=r;out.data[q+1]=gg;out.data[q+2]=bl_;out.data[q+3]=Math.round(Math.min(.86,.28+t*.65)*255)}
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;oc.getContext('2d').putImageData(out,0,0);g.drawImage(oc,0,0);
  // net and lines back on top so the map reads as painted on the court
  g.globalAlpha=.85;paintLines(g,b.Xf,b.Yf,w/1000*1.4,false);g.globalAlpha=1}
function heatmaps(){const host=$('#hm');if(!host.children.length)PL.forEach(p=>{const c=document.createElement('div');c.className='pcard';c.innerHTML=`<header><h3 style="color:${TS[TM[p]]}">${NM[p]}</h3><span class="mm" id="mm_${p}"></span></header><canvas width="736" height="400" id="c_${p}" role="img" aria-label="מפת חום של ${NM[p]}"></canvas>`;host.appendChild(c)});

  $('#hmctl').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.hmPhase=b.dataset.k;heatmaps()})}

function sheet(){const rows=PL.map(p=>{const m=Mx.move[p],l=Mx.lines[p],t=D.team[TM[p]].all,k=PAIR[TM[p]][0]==p?'a':'b',Z=zoneShare(p,'all');const zs=z=>Object.entries(Z).filter(([q])=>q.startsWith(z)).reduce((a,[,v])=>a+v,0);
  const T=Mx.touchz.filter(x=>x.p==p),att=Mx.attackz.filter(x=>x.p==p),kills=att.filter(x=>x.s=='kill'||x.s=='failed_defence').length;
  return [p,m.dist,m.m_per_min,m.top_kmh,m.sprint_pct,t['area50_'+k],t['area90_'+k],l.net,l.base,l.out,zs('net'),zs('mid'),zs('back'),T.length,att.length,kills]});
  const head=['שחקן','ריצה מ׳','מ׳ לדקה','שיא קמ״ש','ספרינט %','שטח 50% מ״ר','שטח 90% מ״ר','לרשת מ׳','לבסיס מ׳','בחוץ %','ליד הרשת','אמצע','מאחור','נגיעות','התקפות','נקודות'];
  const fmt=(v,i)=>i==0?`<span style="color:${TS[TM[v]]};font-weight:800">${NM[v]}</span>`:(i>=10&&i<=12?pct(v):(Number.isInteger(v)?v:(+v).toFixed(1)));
  let html=`<table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
  ['ISR','BRA'].forEach(tm=>{rows.filter(r=>TM[r[0]]==tm).forEach(r=>html+=`<tr>${r.map((v,i)=>`<td class="${i?'n':''}">${fmt(v,i)}</td>`).join('')}</tr>`);
    const so=Mx.sideout[tm],T=D.team[tm],op=(()=>{const v=D.attacks.filter(a=>a.tm==tm).map(a=>a.open).sort((a,b)=>a-b);return v[v.length>>1]})();
    html+=`<tr class="team"><td>${TN[tm]}</td><td colspan="5">זכייה כשמקבלים הגשה ${Math.round(100*so.sideout/so.receive)}% · כשמגישים ${Math.round(100*so.serve_won/so.serve)}%</td><td colspan="5">חפיפה בין השותפים: כדור אצלם ${T['own ball'].overlap.toFixed(2)} · אצל היריב ${T['opponent ball'].overlap.toFixed(2)}</td><td colspan="5">שטח פתוח בהגנה (חציון) ${op} מ״ר</td></tr>`});
  $('#sheet').innerHTML=html+'</tbody></table>'}

function init(){const R=Mx.rallies,s1=R.filter(r=>r.s==1).at(-1),s2=R.at(-1);const sI=(s1.i>s1.b)+(s2.i>s2.b);$('#sI').textContent=sI;$('#sB').textContent=2-sI;
  document.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.sel=null;render()});sandBackground();heatmaps();sheet()}
function render(){document.querySelectorAll('.sb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==S.mode));
  if(S.mode=='heat')viewHeat();else if(S.mode=='holes')viewHoles();else viewAttack();info()}
</script>
