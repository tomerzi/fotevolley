<meta charset="utf-8">
<title>סימון הספקות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one doubtful item at a time on a sand-coloured desk: the footage big, the answer buttons under it, the queue on the side. Single daylight look. */
:root{--sand:#e6cfa2;--sand-hi:#efdcb6;--sand-lo:#d7bb88;--ink:#2a2016;--ink-2:#5e4d37;--ink-3:#8a7556;--table:#f6efe0;--isr:#1f63c9;--bra:#0d7f3f;--hit:#c8322c;--done:#0d7f3f;
  --display:"Rubik","Heebo",system-ui,sans-serif;--body:"Heebo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
html{background:var(--sand)}
body{background:var(--sand);color:var(--ink);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:900 clamp(22px,3.5vw,32px) var(--display);margin:0}
.sub{color:var(--ink-2);font-size:14px}
.prog{display:flex;gap:10px;flex-wrap:wrap;font:500 13px var(--mono)}
.prog span{background:var(--table);border-radius:999px;padding:4px 10px}
.task{background:var(--table);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.thead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.thead h2{font:700 20px var(--display);margin:0}
.ask{font-size:15px;color:var(--ink)}
.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.facts b{color:var(--ink)}
.stage{position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:crosshair;line-height:0}
.stage video,.stage img{width:100%;height:auto;display:block}
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none;display:grid;place-items:center;font:700 11px var(--mono);color:#fff;line-height:1}
.mk.ball{border-color:#ffd400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:500 14px var(--body);background:#fff;border:1.5px solid var(--sand-lo);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--table);border-color:var(--ink)}
.btn.primary{background:var(--done);border-color:var(--done);color:#fff;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--isr);outline-offset:2px}
.hint{font-size:13px;color:var(--ink-3)}
.status{font-size:13px;min-height:1.4em}
.status.err{color:var(--hit)}
aside{background:var(--table);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;max-height:calc(100vh - 40px);position:sticky;top:12px;overflow:auto}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.q button{width:100%;text-align:start;font:14px var(--body);background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;gap:6px}
.q button[aria-current="true"]{background:var(--ink);color:var(--table)}
.q .ok{color:var(--done);font-weight:700}
.q button[aria-current="true"] .ok{color:#9be2b6}
table.tl{border-collapse:collapse;font-size:14px;width:100%}
table.tl td{padding:5px 6px;border-top:1px dashed var(--sand-lo)}
.offline{background:#f3c8c3;color:#8f1d17;border-radius:8px;padding:8px 10px;font-size:14px}
</style>

<div class="wrap" dir="rtl">
  <header>
    <div><h1>סימון הספקות</h1><div class="sub">כל מה שאני בטוח בו פחות מ-99%. כל סימון נשמר מיד ועובר לבא בתור.</div></div>
    <div class="prog" id="prog"></div>
  </header>
  <main class="task" id="task"><div class="hint">טוען…</div></main>
  <aside>
    <div class="flt" id="flt"></div>
    <ul class="q" id="queue"></ul>
  </aside>
</div>

<script>
const TYPES={land:'נחיתות',gap:'מרווח בהגנה',touches:'נקודה 39',question:'נקודה 49'};
let ITEMS=[],MARKS={},cur=0,filter='all',db=null,draft={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let REV=1;
fetch('items.json').then(r=>r.json()).then(j=>{ITEMS=j.items||j;REV=j.rev||1;const f=ITEMS.findIndex(x=>!isDone(x));cur=f<0?0:f;renderAll()});
function isDone(x){const m=MARKS[x.id];if(!m)return false;if(x.type=='gap'&&m.verdict!='cant'&&(!m.pts||m.pts.length!=4))return false;return !x.recheck||m.rev>=REV}
(async()=>{db=await claude.use('db');
  if(!db){$('#task').insertAdjacentHTML('afterbegin','<div class="offline">השמירה לא זמינה בתצוגה הזאת. פתח את הדף כשאתה מחובר ל-claude.ai.</div>');return}
  const t=setTimeout(()=>status('לא מצליח לטעון סימונים קודמים – אפשר להמשיך לסמן.',true),10000);
  db.collection('marks').onSnapshot(s=>{clearTimeout(t);MARKS={};s.docs.forEach(d=>MARKS[d.id]=d.data());renderSide();renderProg()},e=>{clearTimeout(t);status('שגיאה בטעינת סימונים: '+e.message,true)});
})();

function visible(){return ITEMS.map((x,i)=>[x,i]).filter(([x])=>filter=='all'||x.type==filter)}
function renderAll(){renderSide();renderProg();renderTask()}
function renderProg(){const by={};ITEMS.forEach(x=>{by[x.type]=by[x.type]||[0,0];by[x.type][1]++;if(isDone(x))by[x.type][0]++});
  $('#prog').innerHTML=Object.entries(by).map(([k,[a,b]])=>`<span>${TYPES[k]} ${a}/${b}</span>`).join('')}
function renderSide(){
  $('#flt').innerHTML=['all',...Object.keys(TYPES)].map(k=>`<button class="btn" data-f="${k}" aria-pressed="${filter==k}">${k=='all'?'הכל':TYPES[k]}</button>`).join('');
  document.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;const v=visible();if(v.length&&!v.some(([,i])=>i==cur)){cur=v[0][1];renderTask()}renderSide()});
  $('#queue').innerHTML=visible().map(([x,i])=>`<li><button data-i="${i}" aria-current="${i==cur}"><span>${label(x)}</span><span class="ok">${isDone(x)?'✓':(x.recheck&&MARKS[x.id]?'↻':'')}</span></button></li>`).join('');
  document.querySelectorAll('#queue button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;renderTask();renderSide()});
}
function label(x){return x.type=='land'?`נחיתה · נקודה ${x.rally}`:x.type=='gap'?`מרווח · נקודה ${x.rally} · ${x.team}`:TYPES[x.type]}
function status(m,err){const s=$('#status');if(s){s.textContent=m;s.className='status'+(err?' err':'')}}
function stageClick(stage,cb){stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();cb((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)})}
function dot(stage,fx,fy,cls,txt){const m=document.createElement('div');m.className='mk '+(cls||'');m.style.left=(fx*100)+'%';m.style.top=(fy*100)+'%';m.textContent=txt||'';stage.appendChild(m)}

function renderTask(){const x=ITEMS[cur];if(!x)return;const prev=MARKS[x.id];draft=prev?JSON.parse(JSON.stringify(prev)):{};
  const T=$('#task');const head=(x.recheck&&!isDone(x)?`<div class="offline" style="background:#f2d9a6;color:#5a3a00">לבדיקה חוזרת: ${esc(x.recheck)}</div>`:'')+`<div class="thead"><h2>${label(x)}</h2><span class="hint">${cur+1} מתוך ${ITEMS.length}${prev?' · כבר סומן – אפשר לתקן':''}</span></div>`;
  if(x.type=='land'){
    T.innerHTML=head+`<div class="ask">איפה הכדור פגש את החול? עצור את הסרטון ברגע הנגיעה ולחץ על הכדור. אחר כך בחר מה קרה.</div>
      <div class="facts"><span>זכתה: <b>${x.winner=='ISR'?'ישראל':'ברזיל'}</b></span><span>נגיעה אחרונה: <b>${esc(x.last)}</b></span><span>התיוג שלי עכשיו: <b>${esc(x.label)}</b></span></div>
      <div class="stage" id="stage"><video id="vid" src="clips/${x.id}.mp4" controls muted playsinline preload="auto"></video></div>
      <div class="row"><button class="btn" id="back">‹ פריים אחורה</button><button class="btn" id="fwd">פריים קדימה ›</button><button class="btn" id="slow">מהירות ½</button><span class="hint">לחיצה על התמונה עוצרת ומסמנת</span></div>
      <div class="row" id="verd">${['בפנים','בחוץ','ברשת','לא רואים'].map(v=>`<button class="btn" data-v="${v}" aria-pressed="${draft.verdict==v}">${v}</button>`).join('')}</div>
      <div class="row"><button class="btn primary" id="save">שמור והמשך</button><span class="status" id="status"></span></div>`;
    const v=$('#vid'),st=$('#stage');
    v.addEventListener('loadedmetadata',()=>{if(draft.frame!=null)v.currentTime=(draft.frame-x.f0)/25+0.001});
    if(draft.fx!=null)dot(st,draft.fx,draft.fy,'ball');
    v.addEventListener('click',e=>e.preventDefault());
    stageClick(st,(fx,fy)=>{if(fy>0.9)return;v.pause();draft.fx=fx;draft.fy=fy;draft.u=Math.round(fx*1920);draft.v=Math.round(fy*1080);draft.frame=x.f0+Math.round(v.currentTime*25);st.querySelectorAll('.mk').forEach(m=>m.remove());dot(st,fx,fy,'ball');status(`סומן בפריים ${draft.frame}`)});
    $('#back').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-0.04)};$('#fwd').onclick=()=>{v.pause();v.currentTime+=0.04};
    $('#slow').onclick=e=>{v.playbackRate=v.playbackRate==1?0.5:1;e.target.textContent=v.playbackRate==1?'מהירות ½':'מהירות רגילה'};
    document.querySelectorAll('#verd button').forEach(b=>b.onclick=()=>{draft.verdict=b.dataset.v;document.querySelectorAll('#verd button').forEach(c=>c.setAttribute('aria-pressed',c==b))});
    $('#save').onclick=()=>{if(!draft.verdict)return status('בחר מה קרה (בפנים / בחוץ / ברשת / לא רואים).',true);save(x)};
  } else if(x.type=='gap'){
    T.innerHTML=head+`<div class="ask">ארבע לחיצות: שתי הרגליים של המגין הראשון (1, 2) ואז שתי הרגליים של השני (3, 4) – <b>${esc(x.team)}</b>, ${x.team=='ישראל'?'גופיות כחולות':'גופיות צהובות-ירוקות'}, ברגע ההתקפה של היריב. רגל באוויר: לחץ על החול שמתחתיה. רגל מוסתרת: הערכה.</div>
      <div class="facts"><span>מגינה: <b>${esc(x.team)}</b></span><span>פריים ${x.frame}</span></div>
      <div class="stage" id="stage"><img id="img" src="stills/${x.id}.jpg" alt="הפריים ברגע ההתקפה"></div>
      <div class="row"><button class="btn" id="reset">נקה סימונים</button><button class="btn" id="showclip">הצג את הרגע בווידאו</button><button class="btn" data-v="cant" id="cant" aria-pressed="${draft.verdict=='cant'}">לא אפשר לדעת</button></div>
      <div id="clipbox" hidden><video src="clips/${x.id}.mp4" controls muted playsinline loop style="width:100%;border-radius:8px"></video></div>
      <div class="row"><button class="btn primary" id="save">שמור והמשך</button><span class="status" id="status"></span></div>`;
    const st=$('#stage');draft.pts=draft.pts||[];
    const redraw=()=>{st.querySelectorAll('.mk').forEach(m=>m.remove());draft.pts.forEach((p,i)=>dot(st,p.fx,p.fy,i<2?'':'ball',i+1))};redraw();
    stageClick(st,(fx,fy)=>{if(draft.pts.length>=4)draft.pts=[];draft.pts.push({fx,fy,u:Math.round(fx*1920),v:Math.round(fy*1080)});draft.verdict='marked';$('#cant').setAttribute('aria-pressed','false');redraw();status(['','עכשיו הרגל השנייה של המגין הראשון','עכשיו רגל ראשונה של המגין השני','עכשיו הרגל השנייה של המגין השני','ארבע הרגליים סומנו'][draft.pts.length])});
    $('#reset').onclick=()=>{draft.pts=[];delete draft.verdict;redraw()};
    $('#showclip').onclick=()=>{const c=$('#clipbox');c.hidden=!c.hidden};
    $('#cant').onclick=()=>{draft.verdict='cant';draft.pts=[];redraw();$('#cant').setAttribute('aria-pressed','true')};
    $('#save').onclick=()=>{if(draft.verdict!='cant'&&draft.pts.length!=4)return status('צריך ארבעה סימונים (או "לא אפשר לדעת").',true);save(x)};
  } else if(x.type=='touches'){
    T.innerHTML=head+`<div class="ask">בנקודה הזאת רשומים 5 מגעים רצופים לברזיל (מותר 3). מה לא נכון?</div>
      <div class="stage"><video src="clips/r39.mp4" controls muted playsinline preload="auto"></video></div>
      <table class="tl">${x.touches.map((t,i)=>`<tr><td>מגע ${i+1}</td><td class="hint">${((t.f-x.f0)/25).toFixed(2)} ש׳ בסרטון</td><td>${esc(t.p)}</td><td>${esc(t.a)}</td><td><select id="s${i}" aria-label="תיקון למגע ${i+1}"><option value="">נכון</option><option value="none">לא היה מגע</option><option value="Franklin">פרנקלין</option><option value="Hiltinho">הילטיניו</option><option value="Maor_Haas">מאור האס</option><option value="Ron_Ben_Ishay">רון בן ישי</option></select></td></tr>`).join('')}</table>
      <div class="row"><button class="btn primary" id="save">שמור והמשך</button><span class="status" id="status"></span></div>`;
    x.touches.forEach((t,i)=>{const s=$('#s'+i);if(draft.fix&&draft.fix[i])s.value=draft.fix[i]});
    $('#save').onclick=()=>{draft.fix=x.touches.map((t,i)=>$('#s'+i).value);draft.verdict='done';save(x)};
  } else {
    T.innerHTML=head+`<div class="ask">${esc(x.q)}</div>
      <div class="stage"><video src="clips/r49.mp4" controls muted playsinline preload="auto"></video></div>
      <div class="row" id="verd">${x.opts.map(o=>`<button class="btn" data-v="${esc(o)}" aria-pressed="${draft.verdict==o}">${esc(o)}</button>`).join('')}</div>
      <label class="hint" for="note">הערה (לא חובה)</label><textarea id="note" rows="2" style="font:inherit;border-radius:8px;border:1.5px solid var(--sand-lo);padding:6px">${esc(draft.note||'')}</textarea>
      <div class="row"><button class="btn primary" id="save">שמור</button><span class="status" id="status"></span></div>`;
    document.querySelectorAll('#verd button').forEach(b=>b.onclick=()=>{draft.verdict=b.dataset.v;document.querySelectorAll('#verd button').forEach(c=>c.setAttribute('aria-pressed',c==b))});
    $('#save').onclick=()=>{if(!draft.verdict)return status('בחר תשובה.',true);draft.note=$('#note').value;save(x)};
  }
}
let saving=false;
async function save(x){if(!db)return status('השמירה לא זמינה בתצוגה הזאת.',true);if(saving)return;saving=true;$('#save').disabled=true;status('שומר…');
  try{await db.doc('marks/'+x.id).set(Object.assign({},draft,{item:x.id,type:x.type,rally:x.rally,f0:x.f0,rev:REV,at:Date.now()}));MARKS[x.id]=Object.assign({},draft,{rev:REV});
    const v=visible();const nx=v.find(([y,i])=>i>cur&&!isDone(y))||v.find(([y])=>!isDone(y));if(nx)cur=nx[1];renderTask();renderSide();renderProg();status('נשמר ✓')}
  catch(e){status('השמירה נכשלה: '+(e.message||e.code)+' – נסה שוב.',true)}finally{saving=false;const b=$('#save');if(b)b.disabled=false}}
</script>
